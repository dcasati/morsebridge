<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">MorseBridge wiring and connections</title>
  <desc id="desc">The passive paddle's TRS jack tip connects to GPIO4 for dit, ring to GPIO5 for dah, and sleeve to GND on a Waveshare ESP32-S3-Zero. MorseBridge sends keyboard input to a phone or computer using USB-C data or Bluetooth BLE, one route at a time. A charger or power bank supplies USB-C power during Bluetooth use. Only passive contacts are supported, never transmitter or powered keyer voltage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0c8599"/>
    </marker>
    <marker id="power-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#862e9c"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="20" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#000000">
    <text x="24" y="42" font-size="26" font-weight="700">From paddle to app</text>
    <rect x="24" y="90" width="220" height="220" rx="16" fill="#f3e8ff" stroke="#862e9c" stroke-width="2"/>
    <text x="134" y="130" text-anchor="middle" font-size="22" font-weight="700">Passive paddle</text>
    <text x="134" y="159" text-anchor="middle" font-size="17">3.5 mm TRS jack</text>
    <text x="48" y="196" font-size="18">Dit contact</text>
    <text x="48" y="226" font-size="18">Dah contact</text>
    <text x="48" y="256" font-size="18">Common return</text>

    <rect x="450" y="90" width="280" height="220" rx="16" fill="#ede9fe" stroke="#862e9c" stroke-width="2"/>
    <text x="590" y="130" text-anchor="middle" font-size="24" font-weight="700">MorseBridge</text>
    <text x="590" y="159" text-anchor="middle" font-size="17">Waveshare ESP32-S3-Zero</text>
    <text x="468" y="196" font-size="18" font-weight="700">GPIO4</text>
    <text x="468" y="226" font-size="18" font-weight="700">GPIO5</text>
    <text x="468" y="256" font-size="18" font-weight="700">GND</text>
    <text x="590" y="289" text-anchor="middle" font-size="16">Paddle presses = keyboard input</text>

    <g fill="none" stroke-width="3">
      <path d="M244 190 H450" stroke="#862e9c"/>
      <path d="M244 220 H450" stroke="#862e9c"/>
      <path d="M244 250 H450" stroke="#495057"/>
      <path d="M730 180 H970" stroke="#0c8599" marker-end="url(#arrow)"/>
      <path d="M730 246 H970" stroke="#0c8599" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    </g>
    <text x="347" y="182" text-anchor="middle" font-size="16">Tip</text>
    <text x="347" y="212" text-anchor="middle" font-size="16">Ring</text>
    <text x="347" y="242" text-anchor="middle" font-size="16">Sleeve</text>
    <text x="850" y="165" text-anchor="middle" font-size="18" font-weight="700">USB-C data</text>
    <text x="850" y="231" text-anchor="middle" font-size="18" font-weight="700">Bluetooth BLE</text>

    <rect x="970" y="90" width="206" height="220" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
    <text x="1073" y="130" text-anchor="middle" font-size="22" font-weight="700">Morse app</text>
    <text x="1073" y="159" text-anchor="middle" font-size="16">Phone / computer</text>
    <text x="1073" y="206" text-anchor="middle" font-size="18">Morse-It</text>
    <text x="1073" y="235" text-anchor="middle" font-size="17">Morse Code Complete</text>
    <text x="1073" y="264" text-anchor="middle" font-size="18">VBand</text>

    <path d="M590 376 V312" fill="none" stroke="#862e9c" stroke-width="2" marker-end="url(#power-arrow)"/>
    <text x="608" y="351" font-size="16">USB-C power</text>
    <rect x="450" y="376" width="280" height="54" rx="12" fill="#f3e8ff" stroke="#862e9c" stroke-width="2"/>
    <text x="590" y="409" text-anchor="middle" font-size="19">Charger / power bank</text>
    <text x="24" y="365" font-size="18" font-weight="700">Passive contacts only.</text>
    <text x="24" y="394" font-size="17">Never apply transmitter/keying voltage.</text>
    <text x="784" y="351" font-size="18" font-weight="700">One route at a time.</text>
    <text x="784" y="380" font-size="17">Configured USB takes priority.</text>
    <text x="784" y="409" font-size="17">Bluetooth still needs USB-C power.</text>
  </g>
</svg>
