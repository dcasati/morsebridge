<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">MorseBridge electric purple logo</title>
  <desc id="desc">An original neon bridge connects purple and cyan signal nodes on an angular dark badge. MB appears in Morse code beneath the bridge, beside the MorseBridge wordmark and CW. Connected. tagline.</desc>
  <defs>
    <linearGradient id="signal" x1="34" y1="112" x2="190" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b35bff"/>
      <stop offset=".55" stop-color="#ca8aff"/>
      <stop offset="1" stop-color="#52e6ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ac54ff"/>
      <stop offset=".5" stop-color="#392455"/>
      <stop offset="1" stop-color="#52e6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#9a64dc" stroke-opacity=".075" stroke-width=".7"/>
    </pattern>
    <path id="bridge" d="M36 132 C67 132 70 64 112 64 C154 64 157 132 188 132 M36 132 H188 M70 132 V154 M154 132 V154"/>
  </defs>
  <rect width="920" height="400" rx="24" fill="#060710"/>
  <rect x="24" y="24" width="872" height="352" rx="12" fill="url(#grid)"/>
  <path d="M40 88 V54 L54 40 H152 M768 360 H866 L880 346 V312" fill="none" stroke="#9254db" stroke-width="1.5" stroke-opacity=".55"/>
  <g transform="translate(80 88)">
    <path d="M26 1 H198 L223 26 V198 L198 223 H26 L1 198 V26 Z" fill="#100d20" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M14 59 V32 L32 14 H59 M165 210 H192 L210 192 V165" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round">
      <g opacity=".055"><use href="#bridge" stroke-width="26"/></g>
      <g opacity=".10"><use href="#bridge" stroke-width="18"/></g>
      <use href="#bridge" stroke-width="9"/>
    </g>
    <circle cx="36" cy="132" r="18" fill="#b35bff" opacity=".10"/>
    <circle cx="188" cy="132" r="18" fill="#52e6ff" opacity=".10"/>
    <circle cx="36" cy="132" r="10" fill="#b35bff"/>
    <circle cx="188" cy="132" r="10" fill="#52e6ff"/>
    <circle cx="36" cy="132" r="4" fill="#100d20"/>
    <circle cx="188" cy="132" r="4" fill="#100d20"/>
    <g fill="#c69be9">
      <rect x="55" y="179" width="18" height="6" rx="3"/>
      <rect x="79" y="179" width="18" height="6" rx="3"/>
      <rect x="115" y="179" width="18" height="6" rx="3"/>
      <circle cx="142" cy="182" r="3"/>
      <circle cx="154" cy="182" r="3"/>
      <circle cx="166" cy="182" r="3"/>
    </g>
  </g>
  <text x="352" y="208" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="-3"><tspan fill="#eef1ff">Morse</tspan><tspan fill="#bd79ff">Bridge</tspan></text>
  <path d="M357 230 H393" fill="none" stroke="#52e6ff" stroke-width="2"/>
  <text x="357" y="263" fill="#ad9ac7" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5">CW. CONNECTED.</text>
</svg>
